server.port=${SERVER_PORT:8080}
app.base-url=${BASE_URL:http://localhost:8080}
ratelimit.max=${RATE_LIMIT_MAX:120}
ratelimit.window-seconds=${RATE_LIMIT_WINDOW:60}

# springdoc / swagger-ui
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

spring.web.resources.static-locations=classpath:/static/

# ===================================
# Spring AI Configuration
# ===================================

# LLM Backend Selection: mock, openai, azure, ollama, anthropic
app.llm.backend=${AGENT_LLM:mock}
# app.llm.backend=${AGENT_LLM:ollama}

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder-for-dev}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}
spring.ai.openai.chat.options.temperature=0.7

# Azure OpenAI Configuration (uncomment to use)
# spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
# spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
# spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT:gpt-4}
# spring.ai.azure.openai.chat.options.temperature=0.7

# Ollama Configuration (local LLM - uncomment to use)
#spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
#spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:gemma4:12b}
