# Anthropic (Claude) Configuration (uncomment to use)
# spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
# spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-3-sonnet-20240229}
