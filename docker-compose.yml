version: '3.8'

services:
  # Greenfield - URL Shortener Core (independent node)
  greenfield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenfield-node
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=greenfield
      - APP_LLM_BACKEND=mock
      - APP_NODE_TYPE=greenfield
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - agentic-network
    restart: unless-stopped

  # Brownfield - Orchestration with LangChain (independent node)
  brownfield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brownfield-node
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=brownfield
      - APP_LLM_BACKEND=mock
      - APP_NODE_TYPE=brownfield
      - GREENFIELD_URL=http://greenfield:8080
      - GREENFIELD_HEALTH_ENABLED=true
      - GREENFIELD_RETRY_MAX_ATTEMPTS=30
      - GREENFIELD_RETRY_DELAY_MS=2000
      - GREENFIELD_RETRY_MAX_WAIT_MS=120000
    networks:
      - agentic-network
    restart: unless-stopped

networks:
  agentic-network:
    driver: bridge