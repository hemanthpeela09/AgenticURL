plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext{
    springAiVersion = '1.0.0-M6'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'
    
    // Spring AI - Core
    implementation "org.springframework.ai:spring-ai-core:${springAiVersion}"

    // Spring AI - OpenAI (ChatGPT) - uncomment to use OpenAI
    implementation "org.springframework.ai:spring-ai-openai-spring-boot-starter:${springAiVersion}"

    // Spring AI - Azure OpenAI - uncomment to use Azure OpenAI
    // implementation "org.springframework.ai:spring-ai-azure-openai-spring-boot-starter:${springAiVersion}"

    // Spring AI - Ollama (Local LLM) - uncomment to use Ollama
    // implementation "org.springframework.ai:spring-ai-ollama-spring-boot-starter:${springAiVersion}"

    // Spring AI - Anthropic (Claude) - uncomment to use Claude
    // implementation "org.springframework.ai:spring-ai-anthropic-spring-boot-starter:${springAiVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test'){
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('processResources') {
    def uiDist = file("${projectDir}/ui/dist")
    if (uiDist.exists()) {
        from(uiDist) {
            into 'static'
        }
    }
}
